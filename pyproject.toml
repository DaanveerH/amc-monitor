[project]
name = "amc-seat-watch"
version = "0.1.0"
description = "Discord-managed AMC seat availability monitor"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "discord.py>=2.4,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgresql: requires TEST_DATABASE_URL pointing at a disposable PostgreSQL database",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amc_watch"]
